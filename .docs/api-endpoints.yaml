        gallery: { type: array, items: { $ref: '#/components/schemas/PublicPageMediaResponse' } }
        seo: { $ref: '#/components/schemas/PublicPageSEOResponse' }
        sections: { type: array, items: { $ref: '#/components/schemas/PublicPageSectionResponse' } }
    GetPublicPageResponse:
      type: object

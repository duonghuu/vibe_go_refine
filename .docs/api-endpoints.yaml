components:
  schemas:
    ImageContentFieldRule:
      type: object
      required: [enabled, required]
      properties:
        enabled: { type: boolean }
        required: { type: boolean }
    ImageContentFieldConfig:
      type: object
      required: [name, description, secondaryDescription, url]
      properties:
        name: { $ref: '#/components/schemas/ImageContentFieldRule' }
        description: { $ref: '#/components/schemas/ImageContentFieldRule' }
        secondaryDescription: { $ref: '#/components/schemas/ImageContentFieldRule' }
        url: { $ref: '#/components/schemas/ImageContentFieldRule' }
    CreateImageContentTypeRequest:
      type: object
      required: [code, name, status, fieldConfig]
      properties:
        code: { type: string, maxLength: 50, pattern: '^[A-Z][A-Z0-9_]{0,49}$' }
        name: { type: string, maxLength: 100 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer, minimum: 0 }
        maxItems: { type: integer, minimum: 1, maximum: 1000, nullable: true }
        fieldConfig: { $ref: '#/components/schemas/ImageContentFieldConfig' }
    UpdateImageContentTypeRequest:
      type: object
      required: [name, status, fieldConfig]
      properties:
        name: { type: string, maxLength: 100 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer, minimum: 0 }
        maxItems: { type: integer, minimum: 1, maximum: 1000, nullable: true }
        fieldConfig: { $ref: '#/components/schemas/ImageContentFieldConfig' }
    ImageContentTypeResponse:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer }
        maxItems: { type: integer, nullable: true }
        fieldConfig: { $ref: '#/components/schemas/ImageContentFieldConfig' }
        itemCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageContentTypeEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/ImageContentTypeResponse' } }
    ImageContentTypeListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ImageContentTypeResponse' } }
        total: { type: integer, format: int64 }
    CreateImageContentRequest:
      type: object
      required: [typeCode, mediaId, status]
      properties:
        typeCode: { type: string, maxLength: 50 }
        mediaId: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 255, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        secondaryDescription: { type: string, maxLength: 5000, nullable: true }
        url: { type: string, maxLength: 500, nullable: true }
        sortOrder: { type: integer, minimum: 0, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    UpdateImageContentRequest:
      type: object
      required: [mediaId, status]
      properties:
        mediaId: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 255, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        secondaryDescription: { type: string, maxLength: 5000, nullable: true }
        url: { type: string, maxLength: 500, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    AdminImageContentMediaResponse:
      type: object
      properties:
        id: { type: integer }
        fileName: { type: string }
        originalUrl: { type: string }
        thumbnailUrl: { type: string }
        mediumUrl: { type: string }
        mimeType: { type: string }
        status: { type: string, enum: [temporary, attached] }
    ImageContentResponse:
      type: object
      properties:
        id: { type: integer }
        typeCode: { type: string }
        typeName: { type: string }
        fieldConfig: { $ref: '#/components/schemas/ImageContentFieldConfig' }
        mediaId: { type: integer }
        media: { $ref: '#/components/schemas/AdminImageContentMediaResponse' }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        secondaryDescription: { type: string, nullable: true }
        url: { type: string, nullable: true }
        sortOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageContentEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/ImageContentResponse' } }
    ImageContentListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ImageContentResponse' } }
        total: { type: integer, format: int64 }
    ReorderImageContentsRequest:
      type: object
      required: [typeCode, items]
      properties:
        typeCode: { type: string, maxLength: 50 }
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [id, sortOrder]
            properties:
              id: { type: integer, minimum: 1 }
              sortOrder: { type: integer, minimum: 0 }
    PublicImageContentMediaResponse:
      type: object
      properties:
        id: { type: integer }
        originalUrl: { type: string }
        thumbnailUrl: { type: string }
        mediumUrl: { type: string }
        mimeType: { type: string }
    PublicImageContentItemResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        secondaryDescription: { type: string, nullable: true }
        url: { type: string, nullable: true }
        sortOrder: { type: integer }
        media: { $ref: '#/components/schemas/PublicImageContentMediaResponse' }
    PublicImageContentGroupResponse:
      type: object
      properties:
        typeCode: { type: string }
        name: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/PublicImageContentItemResponse' } }
    PublicImageContentResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PublicImageContentGroupResponse' } }
    PublicPageMediaResponse:
      type: object
      required: [id, originalUrl]
      properties:
        id: { type: integer }
        originalUrl: { type: string }
        thumbnailUrl: { type: string }
        mediumUrl: { type: string }
    PublicPageSEOResponse:
      type: object
      required: [resolvedTitle, resolvedDescription, resolvedCanonicalUrl, robots]
      properties:
        resolvedTitle: { type: string }
        resolvedDescription: { type: string }
        resolvedCanonicalUrl: { type: string }
        ogTitle: { type: string }
        ogDescription: { type: string }
        ogImage: { type: string }
        ogType: { type: string }
        twitterTitle: { type: string }
        twitterDescription: { type: string }
        twitterImage: { type: string }
        twitterCard: { type: string }
        robots: { type: string }
        schemaJson: { type: object, nullable: true, additionalProperties: true }
    PublicSectionItemDataResponse:
      type: object
      required: [id, description]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        title: { type: string }
        slug: { type: string }
        typeCode: { type: string }
        imageUrl: { type: string }
        originalUrl: { type: string }
        thumbnailUrl: { type: string }
        mediumUrl: { type: string }
    PublicPageSectionItemResponse:

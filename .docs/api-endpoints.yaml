openapi: 3.0.3
info:
  title: Product Admin API
  version: 1.0.0
paths:
  /api/v1/admin/products:
    get:
      summary: Lấy danh sách sản phẩm (Phân trang & Lọc)
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: _start
          schema:
            type: integer
            default: 0
        - in: query
          name: _end
          schema:
            type: integer
            default: 10
        - in: query
          name: _sort
          schema:
            type: string
        - in: query
          name: _order
          schema:
            type: string
            enum: [ASC, DESC]
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Thành công
    post:
      summary: Thêm mới Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                sku:
                  type: string
                categoryId:
                  type: integer
                price:
                  type: number
                salePrice:
                  type: number
                stock:
                  type: integer
                status:
                  type: string
                  enum: [ACTIVE, HIDDEN, OUT_OF_STOCK]
                image:
                  type: string
      responses:
        '201':
          description: Created
  /api/v1/admin/products/{id}:
    get:
      summary: Lấy chi tiết Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Cập nhật thông tin Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
    delete:
      summary: Xóa (Soft Delete) Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/admin/products/{id}/status:
    patch:
      summary: Đổi trạng thái Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: OK
  /api/v1/admin/products/bulk-delete:
    post:
      summary: Xóa nhiều Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: OK
  /api/v1/admin/products/bulk-status:
    patch:
      summary: Đổi trạng thái nhiều Sản phẩm
      tags:
        - Admin Product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                status:
                  type: string
      responses:
        '200':
          description: OK
  /api/v1/media/upload:
    post:
      summary: Upload file (Hình ảnh)
      tags:
        - Media
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  fileName:
                    type: string
                  originalUrl:
                    type: string
                  thumbnailUrl:
                    type: string
                  mediumUrl:
                    type: string
                  status:
                    type: string
        '400':
          description: Lỗi định dạng file hoặc vượt quá dung lượng
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests (Rate limit)
  /api/v1/media/{id}:
    delete:
      summary: Xóa file tạm thời
      tags:
        - Media
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Xóa thành công
        '401':
          description: Unauthorized
        '404':
          description: File không tồn tại
        '403':
          description: Không có quyền xóa file của người khác
  /api/v1/admin/categories:
    get:
      summary: Lấy danh sách danh mục (Phân trang & Lọc)
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: _start
          schema:
            type: integer
        - in: query
          name: _end
          schema:
            type: integer
        - in: query
          name: _sort
          schema:
            type: string
        - in: query
          name: _order
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: parentId
          schema:
            type: integer
      responses:
        '200':
          description: OK
    post:
      summary: Tạo mới danh mục
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                parentId: { type: integer, nullable: true }
                description: { type: string }
                imageUrl: { type: string }
                sortOrder: { type: integer }
                status: { type: string, enum: [ACTIVE, HIDDEN] }
      responses:
        '201':
          description: Created
  /api/v1/admin/categories/{id}:
    get:
      summary: Lấy chi tiết danh mục
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Cập nhật danh mục
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                parentId: { type: integer, nullable: true }
                description: { type: string }
                imageUrl: { type: string }
                sortOrder: { type: integer }
                status: { type: string, enum: [ACTIVE, HIDDEN] }
      responses:
        '200':
          description: OK
    delete:
      summary: Xóa danh mục
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/admin/categories/bulk-status:
    patch:
      summary: Đổi trạng thái nhiều danh mục
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                status: { type: string, enum: [ACTIVE, HIDDEN] }
      responses:
        '200':
          description: OK
  /api/v1/admin/categories/reorder:
    patch:
      summary: Thay đổi thứ tự danh mục
      tags:
        - Admin Category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      sortOrder: { type: integer }
      responses:
        '200':
          description: OK
  /api/v1/admin/users:
    get:
      summary: Lấy danh sách người dùng (Phân trang & Lọc)
      tags:
        - Admin User
      parameters:
        - in: query
          name: _start
          schema:
            type: integer
        - in: query
          name: _end
          schema:
            type: integer
        - in: query
          name: _sort
          schema:
            type: string
        - in: query
          name: _order
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      summary: Tạo mới người dùng
      tags:
        - Admin User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                name: { type: string }
                role: { type: string, enum: [ADMIN, STAFF, CUSTOMER] }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '201':
          description: Created
  /api/v1/admin/users/{id}:
    get:
      summary: Lấy chi tiết người dùng
      tags:
        - Admin User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Cập nhật người dùng (Không bao gồm email và password)
      tags:
        - Admin User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [ADMIN, STAFF, CUSTOMER] }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: OK
  /api/v1/admin/users/{id}/status:
    patch:
      summary: Đổi trạng thái User
      tags:
        - Admin User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: OK
  /api/v1/admin/users/bulk-status:
    patch:
      summary: Đổi trạng thái nhiều User
      tags:
        - Admin User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: OK
  /api/v1/admin/users/{id}/reset-password:
    patch:
      summary: Reset mật khẩu User
      tags:
        - Admin User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword: { type: string }
      responses:
        '200':
          description: OK
  /api/v1/auth/login:
    post:
      summary: Đăng nhập
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK
  /api/v1/auth/refresh-token:
    post:
      summary: Refresh Token Rotation
      tags:
        - Auth
      responses:
        '200':
          description: OK
  /api/v1/auth/logout:
    post:
      summary: Đăng xuất
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
  /api/v1/auth/me:
    get:
      summary: Lấy thông tin tài khoản hiện tại
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
  /api/v1/admin/post-types:
    get:
      summary: Lấy danh sách loại bài viết
      tags:
        - Admin Post Type
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: _start
          schema:
            type: integer
        - in: query
          name: _end
          schema:
            type: integer
        - in: query
          name: _sort
          schema:
            type: string
        - in: query
          name: _order
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      summary: Tạo loại bài viết mới
      tags:
        - Admin Post Type
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                sort_order: { type: integer }
      responses:
        '201':
          description: Created
  /api/v1/admin/post-types/{id}:
    get:
      summary: Lấy chi tiết loại bài viết
      tags:
        - Admin Post Type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Cập nhật loại bài viết
      tags:
        - Admin Post Type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                sort_order: { type: integer }
      responses:
        '200':
          description: OK
    delete:
      summary: Xóa loại bài viết
      tags:
        - Admin Post Type
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/admin/post-categories/tree:
    get:
      summary: Lấy danh sách cây danh mục bài viết theo loại bài viết
      tags:
        - Admin Post Category
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: typeCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v1/admin/post-categories:
    post:
      summary: Tạo mới danh mục bài viết
      tags:
        - Admin Post Category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                typeCode: { type: string }
                name: { type: string }
                slug: { type: string }
                parentId: { type: integer, nullable: true }
                description: { type: string }
                imageUrl: { type: string }
                sortOrder: { type: integer }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '201':
          description: Created

  /api/v1/admin/post-categories/{id}:
    get:
      summary: Lấy chi tiết danh mục bài viết
      tags:
        - Admin Post Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Cập nhật danh mục bài viết
      tags:
        - Admin Post Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                parentId: { type: integer, nullable: true }
                description: { type: string }
                imageUrl: { type: string }
                sortOrder: { type: integer }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: OK
    delete:
      summary: Xóa danh mục bài viết
      tags:
        - Admin Post Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /api/v1/admin/posts/{post_id}/media:
    get:
      summary: Lấy danh sách Media của bài viết
      tags:
        - Admin Post Media
      x-code-files:
        - apps/backend/internal/controller/post_media_controller.go
        - apps/backend/internal/usecases/postmedia/service/post_media_service.go
        - apps/backend/internal/infrastructure/repository/post_media_repo.go
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: integer
        - in: query
          name: collection
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostMediaResponse'
                  total:
                    type: integer
        '400': { description: Collection hoặc Post ID không hợp lệ }
        '404': { description: Không tìm thấy bài viết }
        '401': { description: Unauthorized hoặc token bị blacklist }
        '403': { description: Không có quyền truy cập }
        '500': { description: Lỗi hệ thống }
    post:
      summary: Liên kết Media vào bài viết
      tags:
        - Admin Post Media
      security:
        - BearerAuth: []
      x-code-files:
        - apps/backend/internal/controller/post_media_controller.go
        - apps/backend/internal/usecases/postmedia/service/post_media_service.go
        - apps/backend/internal/infrastructure/repository/post_media_repo.go
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_id: { type: integer, minimum: 1 }
                collection: { type: string, enum: [thumbnail, gallery, attachment, content] }
                sort_order: { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PostMediaResponse'
        '400': { description: Dữ liệu Media không hợp lệ }
        '403': { description: Không có quyền sử dụng Media }
        '404': { description: Không tìm thấy Post hoặc Media }
        '500': { description: Lỗi hệ thống }
  /api/v1/admin/posts/{post_id}/media/{collection}:
    put:
      summary: Đồng bộ (Sync) Media cho một bộ sưu tập
      tags:
        - Admin Post Media
      security:
        - BearerAuth: []
      x-code-files:
        - apps/backend/internal/controller/post_media_controller.go
        - apps/backend/internal/usecases/postmedia/service/post_media_service.go
        - apps/backend/internal/infrastructure/repository/post_media_repo.go
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: integer
        - in: path
          name: collection
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      sort_order: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostMediaResponse'
        '400': { description: Collection, thumbnail hoặc danh sách Media không hợp lệ }
        '403': { description: Không có quyền sử dụng Media }
        '404': { description: Không tìm thấy Post hoặc Media }
        '500': { description: Lỗi hệ thống }
  /api/v1/admin/posts/{post_id}/media/{media_id}:
    delete:
      summary: Gỡ liên kết Media khỏi bài viết
      tags:
        - Admin Post Media
      security:
        - BearerAuth: []
      x-code-files:
        - apps/backend/internal/controller/post_media_controller.go
        - apps/backend/internal/usecases/postmedia/service/post_media_service.go
        - apps/backend/internal/infrastructure/repository/post_media_repo.go
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: integer
        - in: path
          name: media_id
          required: true
          schema:
            type: integer
        - in: query
          name: collection
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400': { description: URI hoặc collection không hợp lệ }
        '403': { description: Không có quyền gỡ Media }
        '404': { description: Không tìm thấy Post hoặc Media }
        '500': { description: Lỗi hệ thống }
  /api/v1/admin/posts/{postId}/meta:
    get:
      summary: Lấy danh sách Meta của một Bài viết
      tags:
        - Admin Post Meta
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:

components:
  schemas:
    CreatePageRequest:
      type: object
      required:
        - title
        - slug
        - content
        - status
      properties:
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
    PageResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        authorId: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageListItemResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        authorId: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaginatedPageResponse:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PageListItemResponse'
        total: { type: integer, format: int64 }
    DeletePageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    UpdatePageRequest:
      type: object
      required: [title, slug, content, status]
      properties:
        title: { type: string, maxLength: 255 }
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        content: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
    UpdatePageResponse:
      type: object
      required: [data, message]
      properties:
        data:
          $ref: '#/components/schemas/PageResponse'
        message: { type: string }
    UpdatePostRequest:
      type: object
      required:
        - title
        - slug
        - content
      properties:
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9-]+$'
        content:
          type: string
        categoryId:
          type: integer
          nullable: true
    PostResponse:
      type: object
      properties:
        id:
          type: integer
        typeCode:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        authorId:
          type: integer
        categoryId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MediaResponse:
      type: object
      properties:
        id: { type: integer }
        fileName: { type: string }
        originalUrl: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        mediumUrl: { type: string, nullable: true }
        mimeType: { type: string }
        size: { type: integer, format: int64 }
        status: { type: string, enum: [temporary, attached] }
    PostMediaResponse:
      type: object
      properties:
        id: { type: integer }
        postId: { type: integer }
        mediaId: { type: integer }
        collection: { type: string, enum: [thumbnail, gallery] }
        sortOrder: { type: integer }
        media:
          $ref: '#/components/schemas/MediaResponse'
    UpsertSEOMetaRequest:
      type: object
      properties:
        meta_title: { type: string, maxLength: 255, nullable: true }
        meta_description: { type: string, maxLength: 500, nullable: true }
        meta_keywords: { type: string, maxLength: 500, nullable: true }
        canonical_url: { type: string, format: uri, maxLength: 500, nullable: true }
        og_title: { type: string, maxLength: 255, nullable: true }
        og_description: { type: string, maxLength: 500, nullable: true }
        og_image: { type: string, format: uri, maxLength: 500, nullable: true }
        og_type: { type: string, maxLength: 100, nullable: true }
        twitter_title: { type: string, maxLength: 255, nullable: true }
        twitter_description: { type: string, maxLength: 500, nullable: true }
        twitter_image: { type: string, format: uri, maxLength: 500, nullable: true }
        twitter_card: { type: string, maxLength: 100, nullable: true }
        robots: { type: string, enum: ['index,follow', 'noindex,follow', 'noindex,nofollow'], nullable: true }
        schema_json: { type: object, nullable: true, additionalProperties: true }
    SEOMetaResponse:
      allOf:
        - $ref: '#/components/schemas/UpsertSEOMetaRequest'
        - type: object
          properties:
            entity_type: { type: string }
            entity_id: { type: integer }
            resolved_title: { type: string }
            resolved_description: { type: string }
            resolved_canonical_url: { type: string }
    SEOMetaResponseEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SEOMetaResponse' }
    UpsertSEOMetaResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SEOMetaResponse' }
        message: { type: string }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

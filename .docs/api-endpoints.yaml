      properties:
        itemType: { type: string, enum: [CATEGORY, POST, MEDIA] }
        itemId: { type: integer }
        sortOrder: { type: integer }
        data: { $ref: '#/components/schemas/PublicSectionItemDataResponse' }
    PublicPageSectionMediaResponse:
      allOf:
        - $ref: '#/components/schemas/PublicPageMediaResponse'
    PublicPageSectionResponse:
      type: object
      required: [id, key, title, description, sortOrder, collections]
      properties:
        id: { type: integer }
        key: { type: string }
        title: { type: string }
        description: { type: string }
        backgroundColor: { type: string, nullable: true }
        backgroundMedia: { $ref: '#/components/schemas/PublicPageSectionMediaResponse', nullable: true }
        featureMedia: { $ref: '#/components/schemas/PublicPageSectionMediaResponse', nullable: true }
        sortOrder: { type: integer }
        collections:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/PublicPageSectionItemResponse' }
    PublicPageResponse:
      type: object
      required: [id, title, slug, content, updatedAt, thumbnail, gallery, seo, sections]
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }

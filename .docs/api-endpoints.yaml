        og_image: { type: string, format: uri, maxLength: 500, nullable: true }
        og_type: { type: string, maxLength: 100, nullable: true }
        twitter_title: { type: string, maxLength: 255, nullable: true }
        twitter_description: { type: string, maxLength: 500, nullable: true }
        twitter_image: { type: string, format: uri, maxLength: 500, nullable: true }
        twitter_card: { type: string, maxLength: 100, nullable: true }
        robots: { type: string, enum: ['index,follow', 'noindex,follow', 'noindex,nofollow'], nullable: true }
        schema_json: { type: object, nullable: true, additionalProperties: true }
    SEOMetaResponse:
      allOf:
        - $ref: '#/components/schemas/UpsertSEOMetaRequest'
        - type: object
          properties:
            entity_type: { type: string }
            entity_id: { type: integer }
            resolved_title: { type: string }
            resolved_description: { type: string }
            resolved_canonical_url: { type: string }
    SEOMetaResponseEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SEOMetaResponse' }
    UpsertSEOMetaResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SEOMetaResponse' }
        message: { type: string }
    PageSectionListResponse:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/PageSectionResponse' } }, total: { type: integer } }
    PageSectionResponse:
      type: object
      properties: { id: { type: integer }, pageId: { type: integer }, key: { type: string }, name: { type: string }, title: { type: string }, description: { type: string }, sortOrder: { type: integer }, status: { type: string }, collections: { type: array, items: { type: object } } }
    CreatePageSectionRequest:
      type: object
      required: [key, name, status]
      properties: { key: { type: string, pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$' }, name: { type: string }, title: { type: string }, description: { type: string }, backgroundColor: { type: string }, backgroundMediaId: { type: integer, nullable: true }, featureMediaId: { type: integer, nullable: true }, sortOrder: { type: integer }, status: { type: string, enum: [ACTIVE, INACTIVE] } }
    UpdatePageSectionRequest:
      allOf: [{ $ref: '#/components/schemas/CreatePageSectionRequest' }]
    ReorderPageSectionsRequest:
      type: object
      required: [sections]
      properties: { sections: { type: array, maxItems: 100, items: { type: object, required: [id, sortOrder], properties: { id: { type: integer }, sortOrder: { type: integer } } } } }
    SyncSectionCollectionRequest:
      type: object
      required: [itemType]
      properties: { itemType: { type: string, enum: [CATEGORY, POST, MEDIA] }, items: { type: array, maxItems: 100, items: { type: object, required: [itemId, sortOrder], properties: { itemId: { type: integer }, sortOrder: { type: integer } } } } }
    MediaListResponse:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/MediaListItem' } }, total: { type: integer } }
    MediaListItem:
      type: object
      properties: { id: { type: integer }, fileName: { type: string }, originalUrl: { type: string }, thumbnailUrl: { type: string }, mediumUrl: { type: string }, mimeType: { type: string }, size: { type: integer }, status: { type: string }, createdAt: { type: string, format: date-time } }
  parameters:
    PageId: { in: path, name: page_id, required: true, schema: { type: integer, minimum: 1 } }
    SectionId: { in: path, name: section_id, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    PageNotFound: { description: PAGE_NOT_FOUND }
    SectionNotFound: { description: SECTION_NOT_FOUND }
    ValidationError: { description: VALIDATION_ERROR }
    SectionConflict: { description: SECTION_KEY_CONFLICT or SECTION_ITEM_CONFLICT }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
